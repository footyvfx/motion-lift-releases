<!-- The early-access lock (extension/tools/early_access.mjs fills in the payload below when release.py site publishes with
     early access on). The real page is in the payload, encrypted: a valid key opens it and it replaces this one. The key is
     remembered on this device (localStorage), and this visit's content key in sessionStorage, so the next page opens at
     once. Self-contained on purpose: no fonts, no CDN, nothing that runs before a key is checked. -->
<style>
  :root { --bg: #1b1b1b; --surface: #232323; --line: rgba(255,255,255,.08); --line-2: rgba(255,255,255,.14);
    --text-1: #f2f2f2; --text-2: #b9b9b9; --text-3: #8a8a8a; --accent: #ff7a3d; --accent-ink: #220f05; --bad: #ff8a7a;
    --font: -apple-system, BlinkMacSystemFont, "Inter", "Segoe UI", Roboto, Helvetica, Arial, sans-serif; }
  * { box-sizing: border-box; }
  html { -webkit-text-size-adjust: 100%; }
  body { margin: 0; min-height: 100vh; display: grid; place-items: center; padding: 24px 16px; background: var(--bg);
    background-image: radial-gradient(60% 50% at 50% 38%, rgba(255,122,61,.12), transparent 70%); color: var(--text-1); font: 16px/1.6 var(--font); }
  .gate { width: 100%; max-width: 440px; text-align: center; }
  .mark { width: 56px; height: 56px; margin: 0 auto 22px; position: relative; }
  .mark::before { content: ""; position: absolute; inset: 9px; border-radius: 22%; transform: rotate(45deg);
    background: linear-gradient(135deg, #ffc09b, #ff7a3d 50%, #c4410d); box-shadow: 0 18px 40px -14px rgba(255,122,61,.65); }
  .pill { display: inline-block; font-size: 12px; font-weight: 650; letter-spacing: .04em; text-transform: uppercase; color: var(--accent);
    border: 1px solid rgba(255,122,61,.4); border-radius: 999px; padding: 3px 11px; margin-bottom: 16px; }
  h1 { font-size: clamp(26px, 6vw, 34px); line-height: 1.12; letter-spacing: -.025em; margin: 0 0 12px; }
  p { color: var(--text-2); margin: 0 0 26px; }
  form { display: grid; gap: 10px; text-align: left; }
  label { font-size: 13px; color: var(--text-3); }
  .row { display: flex; gap: 8px; }
  input { flex: 1; min-width: 0; height: 48px; padding: 0 14px; border-radius: 12px; border: 1px solid var(--line-2); background: var(--surface);
    color: var(--text-1); font: 600 16px ui-monospace, SFMono-Regular, Menlo, Consolas, monospace; letter-spacing: .06em; text-transform: uppercase; outline: none; }
  input::placeholder { color: #5c5c5c; letter-spacing: .06em; }
  input:focus { border-color: var(--accent); box-shadow: 0 0 0 3px rgba(255,122,61,.18); }
  button { height: 48px; padding: 0 22px; border: 0; border-radius: 12px; background: var(--accent); color: var(--accent-ink); font: 650 16px var(--font); cursor: pointer; }
  button:hover { background: #ff8b55; }
  button:disabled { opacity: .6; cursor: default; }
  button:focus-visible, input:focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; }
  .msg { min-height: 1.5em; font-size: 14px; color: var(--bad); }
  .msg.ok { color: var(--text-2); }
  .foot { margin-top: 34px; font-size: 13px; color: var(--text-3); }
  .foot a { color: var(--text-2); }
  .opening { display: none; color: var(--text-2); }
  body.checking form, body.checking p, body.checking h1, body.checking .pill { display: none; }
  body.checking .opening { display: block; }
</style>
</head>

      <button id="go" type="submit">Enter</button>
    </div>
    <div class="msg" id="msg" aria-live="polite"></div>
  </form>

<script>
(function () {
  "use strict";
  var KEY = "footy1x-ea-key", CEK = "footy1x-ea-cek";
  var P = JSON.parse(document.getElementById("ea-payload").textContent);
  var body = document.body, form = document.getElementById("ea"), input = document.getElementById("key"),
      go = document.getElementById("go"), msg = document.getElementById("msg");
  function say(t, ok) { msg.textContent = t || ""; msg.className = "msg" + (ok ? " ok" : ""); }
  function store(kind, k, v) { try { var s = kind === "local" ? localStorage : sessionStorage; if (v === null) s.removeItem(k); else if (v !== undefined) s.setItem(k, v); return s.getItem(k); } catch (e) { return null; } }
  var subtle = window.crypto && window.crypto.subtle;
  if (!subtle || !window.TextEncoder) { say("This browser can't open early access. Use a recent Chrome, Safari, Edge or Firefox."); go.disabled = true; return; }
  var enc = new TextEncoder();
  function b64(s) { var b = atob(s), u = new Uint8Array(b.length); for (var i = 0; i < b.length; i++) u[i] = b.charCodeAt(i); return u; }
  function unb64(u) { var s = ""; for (var i = 0; i < u.length; i++) s += String.fromCharCode(u[i]); return btoa(s); }
  function canon(k) { return String(k || "").toUpperCase().replace(/[^0-9A-Z]/g, ""); }
  function hex(buf) { var u = new Uint8Array(buf), s = ""; for (var i = 0; i < u.length; i++) s += (u[i] < 16 ? "0" : "") + u[i].toString(16); return s; }
  function open(keyBytes, sealed) {         // AES-256-GCM: iv (12) | ciphertext | tag
    return subtle.importKey("raw", keyBytes, "AES-GCM", false, ["decrypt"]).then(function (k) {
      return subtle.decrypt({ name: "AES-GCM", iv: sealed.slice(0, 12) }, k, sealed.slice(12));
    }).then(function (b) { return new Uint8Array(b); });
  }
  // the content key for an early-access key, or null: its copy is filed under sha256("footy1x-ea|" + key)'s first 16 hex
  function cekFor(key) {
    var c = canon(key);
    if (c.length < 10) return Promise.resolve(null);
    return subtle.digest("SHA-256", enc.encode("footy1x-ea|" + c)).then(function (d) {
      var wrapped = P.keys[hex(d).slice(0, 16)];
      if (!wrapped) return null;
      return subtle.importKey("raw", enc.encode(c), "PBKDF2", false, ["deriveBits"]).then(function (base) {
        return subtle.deriveBits({ name: "PBKDF2", hash: "SHA-256", salt: b64(P.salt), iterations: P.iter }, base, 256);
      }).then(function (bits) { return open(new Uint8Array(bits), b64(wrapped)); }).catch(function () { return null; });
    });
  }
  // The real page goes in only once this one has fully loaded. Before it has finished parsing, document.open() is ignored
  // and the page gets appended to this one, two <head>s and all; between parsing and the load event, the page's script
  // tags download but never run (Chrome, 9 Oct 2026). A remembered key opens the page in a few ms, so it can be that early.
  function parsed() { return document.readyState === "complete" ? Promise.resolve() : new Promise(function (r) { window.addEventListener("load", r, { once: true }); }); }
  function show(cek) {                        // the real page replaces this one
    return open(cek, b64(P.page)).then(function (bytes) {
      store("session", CEK, JSON.stringify({ salt: P.salt, cek: unb64(cek) }));
      var html = new TextDecoder().decode(bytes);
      return parsed().then(function () { document.open(); document.write(html); document.close(); });
    });
  }
  function ask(t) { body.classList.remove("checking"); say(t || ""); input.focus(); }
  form.addEventListener("submit", function (e) {
    e.preventDefault();
    var k = input.value;
    if (canon(k).length < 10) { say("Enter the whole key: it looks like EA-XXXX-XXXX-XXXX."); return; }
    go.disabled = true; say("Checking…", true);
    cekFor(k).then(function (cek) {
      if (!cek) { go.disabled = false; say("That key didn't work. Check it matches the one you were sent (dashes and capitals don't matter)."); return; }
      store("local", KEY, canon(k));
      return show(cek);
    }).catch(function () { go.disabled = false; say("Something went wrong opening the page. Try again."); });
  });
  // this visit already opened a page: same publish, same content key, no PBKDF2 wait
  var cached = null;
  try { cached = JSON.parse(store("session", CEK) || "null"); } catch (e) { cached = null; }
  if (cached && cached.salt === P.salt && cached.cek) {
    body.classList.add("checking");
    show(b64(cached.cek)).catch(function () { store("session", CEK, null); ask(); });
    return;
  }
  var saved = store("local", KEY);
  if (saved) {
    body.classList.add("checking");
    cekFor(saved).then(function (cek) {
      if (cek) return show(cek);
      store("local", KEY, null);
      ask("Your saved key doesn't open footy1x.store any more. Enter a new one.");
    }).catch(function () { ask(); });
    return;
  }
  input.focus();
})();
